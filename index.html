<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>点餐</title>
<style>
  :root{
    --primary:#ff6b35; --primary-dark:#e5521a;
    --bg:#f6f7f9; --card:#fff; --text:#222; --sub:#8a8f98;
    --line:#ececf0; --price:#ff4d2d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
  .app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:96px;}

  .header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#ff6b35,#ff8b4d);color:#fff;padding:14px 16px 12px;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(255,107,53,.25);display:flex;align-items:center;justify-content:space-between;}
  .shop{font-size:19px;font-weight:700;letter-spacing:.5px;}.sub{font-size:12px;opacity:.9;margin-top:3px;}
  .admbtn{border:1px solid #fff;background:rgba(255,255,255,.18);color:#fff;font-size:13px;padding:6px 12px;border-radius:16px;}
  .admbtn.on{background:#fff;color:var(--primary);font-weight:600;border-color:#fff;}

  .cats{position:sticky;top:67px;z-index:15;display:flex;gap:8px;overflow-x:auto;padding:12px 14px;background:var(--bg);}
  .cats::-webkit-scrollbar{display:none;}
  .cat{flex:0 0 auto;padding:7px 15px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px;color:#444;white-space:nowrap;}
  .cat.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;}

  .list{padding:4px 14px;}
  .goods{display:flex;gap:12px;padding:14px;background:var(--card);border-radius:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .thumb{width:78px;height:78px;border-radius:12px;flex:0 0 78px;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;overflow:hidden;background:#eee;}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .info{flex:1;min-width:0;display:flex;flex-direction:column;}
  .row{display:flex;align-items:center;gap:6px;}
  .name{font-size:15px;font-weight:600;}
  .ed-badge{font-size:10px;color:var(--primary);border:1px solid var(--primary);padding:1px 5px;border-radius:6px;flex:0 0 auto;}
  .bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
  .price{color:var(--price);font-weight:700;font-size:16px;}.price span{font-size:12px;}
  .gbtns{display:flex;gap:8px;align-items:center;}
  .add{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(255,107,53,.35);}
  .mini{font-size:12px;padding:5px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#444;}
  .mini.danger{color:#e5484d;border-color:#f2b8ba;}

  .bar{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
  .barinner{display:flex;align-items:center;gap:12px;background:#2b2b33;border-radius:26px;padding:12px 16px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .carticon{font-size:26px;position:relative;}
  .badge{position:absolute;top:-6px;right:-10px;background:var(--primary);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #2b2b33;}
  .total{flex:1;font-size:13px;}.total b{font-size:18px;}
  .checkout{background:var(--primary);border:none;color:#fff;font-size:15px;font-weight:600;padding:10px 22px;border-radius:20px;}
  .disabled{opacity:.4;pointer-events:none;}

  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:.25s;}
  .mask.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:#fff;z-index:50;border-radius:20px 20px 0 0;transform:translateY(100%);transition:.28s;}
  .drawer.show{transform:translateY(0);}
  .drawer-head{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);}
  .drawer-head b{font-size:16px;}
  .clear{color:var(--primary);font-size:13px;border:none;background:none;}
  .cart-list{max-height:50vh;overflow-y:auto;}
  .cart-item{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);}
  .cart-item .nm{flex:1;font-size:14px;}
  .cart-item .pr{color:var(--price);font-weight:600;font-size:14px;margin-right:10px;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .st-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;color:#444;}
  .st-num{min-width:22px;text-align:center;font-weight:600;font-size:14px;}
  .empty{padding:40px 0;text-align:center;color:var(--sub);font-size:14px;}

  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-mask.show{display:flex;}
  .modal{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:20px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:17px;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fff;}
  .field textarea{resize:none;height:54px;}
  .imgpick{display:flex;align-items:center;gap:10px;}
  .imgpick .pv{width:70px;height:70px;border-radius:10px;overflow:hidden;background:#eee;display:flex;align-items:center;justify-content:center;font-size:34px;}
  .imgpick .pv img{width:100%;height:100%;object-fit:cover;}
  .img-btns{display:flex;flex-direction:column;gap:6px;}
  .img-btns button{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#444;}
  .emoji-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .emoj{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .emoj.on{border-color:var(--primary);background:#fff3ec;}

  .detail{text-align:center;}
  .detail .dimg{width:100%;height:170px;border-radius:14px;object-fit:cover;background:linear-gradient(135deg,#ffd5c2,#ffb08a);display:flex;align-items:center;justify-content:center;font-size:70px;}
  .detail .dname{font-size:19px;font-weight:700;margin-top:12px;}
  .detail .ddesc{color:var(--sub);font-size:13px;margin-top:6px;}
  .detail .drow{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:16px;}
  .detail .dprice{color:var(--price);font-weight:700;font-size:22px;}
  .detail .dprice span{font-size:13px;}
  .detail .dbtns{display:flex;gap:10px;margin-top:8px;}

  .toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:99;background:rgba(0,0,0,.75);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;}
  .toast.show{opacity:1;}

  .btn-primary{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;}
  .btn-ghost{background:#fff;color:#444;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;}
  .btn-danger{background:#e5484d;color:#fff;border:none;padding:10px 16px;border-radius:12px;font-size:14px;}
  .additem{width:100%;padding:14px;border:1.5px dashed var(--primary);border-radius:16px;color:var(--primary);background:#fff7f2;font-size:14px;font-weight:600;margin-top:4px;}
  .additem.gray{border-color:#bbb;color:#666;background:#fafafa;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div><div class="shop">🍽️ Jhome大厨</div><div class="sub">云端菜单 · 全员共享</div></div>
    <button class="admbtn" id="admbtn" onclick="toggleAdm()">管理模式</button>
  </div>

  <div class="cats" id="cats"></div>
  <div class="list" id="list"><div class="empty">菜单加载中…</div></div>

  <div class="bar">
    <div class="barinner">
      <div class="carticon" onclick="toggleDrawer()">🛒<span class="badge" id="badge">0</span></div>
      <div class="total">合计 <b id="totalPrice">¥0</b></div>
      <button class="checkout disabled" id="checkout" onclick="share()">分享</button>
    </div>
  </div>
</div>

<div class="mask" id="mask" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><b>已选菜品</b><button class="clear" onclick="clearCart()">清空</button></div>
  <div class="cart-list" id="cartList"></div>
</div>

<!-- 详情弹窗 -->
<div class="modal-mask" id="detailMask" onclick="if(event.target===this)closeDetail()">
  <div class="modal"><div id="detailBody"></div></div>
</div>

<!-- 编辑/新增弹窗 -->
<div class="modal-mask" id="formMask" onclick="if(event.target===this)closeForm()">
  <div class="modal">
    <h3 id="formTitle">新增菜品</h3>
    <div class="field"><label><span style="color:red">*</span> 菜名</label><input id="fName" required placeholder="请输入菜名"></div>
    <div class="field"><label><span style="color:red">*</span> 价格(元)</label><input id="fPrice" type="number" min="0" step="0.1" required placeholder="如 28"></div>
    <div class="field"><label>描述</label><textarea id="fDesc" placeholder="菜品介绍"></textarea></div>
    <div class="field"><label><span style="color:red">*</span> 分类</label>
      <input id="fCat" list="catOptions" required placeholder="输入分类名或选择已有">
      <datalist id="catOptions"></datalist>
    </div>
    <div class="field"><label>图片</label>
      <div class="imgpick">
        <div class="pv" id="fPv">🍽️</div>
        <div class="img-btns">
          <button onclick="pickImg()">📷 上传图片</button>
          <button onclick="toggleEmoji()">😀 选表情</button>
        </div>
      </div>
      <div class="emoji-list" id="emojiList" style="display:none"></div>
      <input type="file" id="fImgFile" accept="image/*" style="display:none">
    </div>
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn-ghost" style="flex:1" onclick="closeForm()">取消</button>
      <button class="btn-primary" style="flex:1" onclick="saveForm()">保存</button>
    </div>
  </div>
</div>

<!-- 分类管理弹窗 -->
<div class="modal-mask" id="catMask" onclick="if(event.target===this)closeCat()">
  <div class="modal">
    <h3>分类管理</h3>
    <div class="cart-list" id="catList"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <input id="newCatName" placeholder="输入新分类名" style="flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px">
      <button class="btn-primary" onclick="addCat()">新增</button>
    </div>
    <div style="margin-top:16px"><button class="btn-ghost" style="width:100%" onclick="closeCat()">关闭</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/aipexbase-js/dist/aipexbase.umd.min.js"></script>
<script>
/* ====== AiPexBase 云端数据库 ====== */
const client = aipexbase.createClient({
  baseUrl: 'https://baas.kuafuai.net/baas-api',
  apiKey: 'baas_HdPsRkqz'
});

const EMO=["🍽️","🍖","🍗","🍚","🍜","🥟","🍤","🌮","🥗","🍢","🍡","🍰","🍮","🥤","🍊","🍋","🍺","☕","🍦","🍧"];

let items=[];
let categories=[];
let cart={};
let curCat=0, adm=false;
let editingId=null, curImgInfo=null, chosenEmoji='🍽️';

/* ---------- 加载云端数据 ---------- */
async function loadData(){
  try{
    const [rc,rd]=await Promise.all([
      client.db.from('categories').list(),
      client.db.from('dishes').list()
    ]);
    categories=(rc&&rc.success)?(rc.data||[]).slice().sort((a,b)=>(a.sort||0)-(b.sort||0)):[];
    items=(rd&&rd.success)?rd.data||[]:[];
  }catch(e){ categories=[]; items=[]; console.error('加载失败',e); }
  render();updateBar();
}

function toggleAdm(){adm=!adm;document.getElementById('admbtn').classList.toggle('on',adm);document.getElementById('admbtn').textContent=adm?'完成':'管理模式';render();}
function render(){renderCats();renderList();}
function renderCats(){
  if(curCat>=categories.length)curCat=0;
  const html=categories.map((x,i)=>`<div class="cat ${i===curCat?'on':''}" onclick="switchCat(${i})">${x.name}</div>`).join('');
  document.getElementById('cats').innerHTML=html||'<div class="cat">暂无分类</div>';
}
function switchCat(i){curCat=i;render();}
function renderList(){
  const cur=categories[curCat]?categories[curCat].name:'';
  const list=items.filter(i=>i.cat===cur);
  let html=list.map(g=>`
    <div class="goods" onclick="openDetail(${g.id})">
      <div class="thumb">${thumb(g)}</div>
      <div class="info">
        <div class="row"><div class="name">${g.name}</div>${adm?`<span class="ed-badge">编辑</span>`:''}</div>
        <div class="bottom">
          <div class="price"><span>¥</span>${g.price}</div>
          <div class="gbtns">
            ${adm?`<button class="mini" onclick="event.stopPropagation();openEdit(${g.id})">编辑</button><button class="mini danger" onclick="event.stopPropagation();delItem(${g.id})">删除</button>`:`<button class="add" onclick="event.stopPropagation();addToCart(${g.id})">+</button>`}
          </div>
        </div>
      </div>
    </div>`).join('');
  if(adm)html+=`<button class="additem gray" onclick="openCat()">🗂 分类管理</button><button class="additem" onclick="openAdd()">＋ 新增菜品</button>`;
  document.getElementById('list').innerHTML=html||'<div class="empty">该分类暂无菜品</div>';
}
const thumb=g=>g.img?`<img src="${g.img}">`:`<span style="background:linear-gradient(135deg,${g.color||'#ff8b4d'},${g.color||'#ff8b4d'})">${g.emoji||'🍽️'}</span>`;

/* ---------- 购物车 ---------- */
function addToCart(id){cart[id]=cart[id]||{item:items.find(i=>i.id===id),num:0};cart[id].num++;updateBar();toast(`已加入：${items.find(i=>i.id===id).name}`);}
function dec(id){cart[id].num--;if(cart[id].num<=0)delete cart[id];updateBar();}
function updateBar(){
  let n=0,t=0;for(const k in cart){n+=cart[k].num;t+=cart[k].num*cart[k].item.price;}
  document.getElementById('badge').textContent=n;
  document.getElementById('totalPrice').textContent='¥'+t;
  document.getElementById('checkout').classList.toggle('disabled',n===0);
  renderCart();
}
function renderCart(){
  const box=document.getElementById('cartList');const keys=Object.keys(cart);
  if(!keys.length){box.innerHTML='<div class="empty">购物车是空的，快去点餐吧~</div>';return;}
  box.innerHTML=keys.map(id=>{const c=cart[id];const it=c.item;return `
    <div class="cart-item">
      <div class="nm">${it.name}<br><span style="color:var(--sub);font-size:12px">¥${it.price}</span></div>
      <div class="pr">¥${it.price*c.num}</div>
      <div class="stepper">
        <button class="st-btn" onclick="dec(${id})">−</button>
        <span class="st-num">${c.num}</span>
        <button class="st-btn" onclick="addToCart(${id})">+</button>
      </div>
    </div>`;}).join('');
}
function toggleDrawer(){const has=Object.keys(cart).length;document.getElementById('mask').classList.toggle('show',has);document.getElementById('drawer').classList.toggle('show',has);}
function clearCart(){for(const k in cart)delete cart[k];updateBar();toggleDrawer();}
function share(){
  const keys=Object.keys(cart);
  if(!keys.length){toast('购物车是空的');return;}
  let lines=['🍽️ Jhome大厨 点餐清单',''];
  keys.forEach(id=>{const c=cart[id];lines.push(`▪ ${c.item.name} x${c.num}`);if(c.item.descr)lines.push(`   ${c.item.descr}`);});
  const txt=lines.join('\n');
  if(navigator.share){ navigator.share({text:txt}).catch(()=>copyTxt(txt)); }
  else{ copyTxt(txt); }
}
function copyTxt(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast('清单已复制，去粘贴给朋友')).catch(()=>toast('复制失败')); }
  else{ toast('当前环境不支持分享'); }
}

/* ---------- 详情 ---------- */
function openDetail(id){
  const g=items.find(i=>i.id===id);if(!g)return;
  document.getElementById('detailBody').innerHTML=`
    <div class="detail">
      ${g.img?`<img class="dimg" src="${g.img}">`:`<div class="dimg" style="background:linear-gradient(135deg,${g.color},${g.color})">${g.emoji||'🍽️'}</div>`}
      <div class="dname">${g.name}</div>
      <div class="ddesc">${g.descr||''}</div>
      <div class="drow"><div class="dprice"><span>¥</span>${g.price}</div></div>
      ${adm?`<div class="dbtns">
        <button class="btn-primary" style="flex:1" onclick="closeDetail();openEdit(${g.id})">编辑</button>
        <button class="btn-danger" style="flex:1" onclick="delItem(${g.id})">删除</button>
      </div>`:`<div class="dbtns">
        <button class="btn-ghost" style="flex:1" onclick="closeDetail()">返回</button>
        <button class="btn-primary" style="flex:1" onclick="addToCart(${g.id})">加入购物车</button>
      </div>`}
    </div>`;
  document.getElementById('detailMask').classList.add('show');
}
function closeDetail(){document.getElementById('detailMask').classList.remove('show');}

/* ---------- 新增/编辑菜品 ---------- */
function openAdd(){
  editingId=null;chosenEmoji='🍽️';curImgInfo=null;
  document.getElementById('formTitle').textContent='新增菜品';
  document.getElementById('fName').value='';document.getElementById('fPrice').value='';document.getElementById('fDesc').value='';
  document.getElementById('fCat').value='';
  document.getElementById('fPv').innerHTML='🍽️';
  refreshCatOptions();renderEmoji();
  document.getElementById('formMask').classList.add('show');
}
function openEdit(id){
  const g=items.find(i=>i.id===id);if(!g)return;
  editingId=id;chosenEmoji=g.emoji||'🍽️';curImgInfo=g.img?{type:'img',data:g.img}:null;
  document.getElementById('formTitle').textContent='编辑菜品';
  document.getElementById('fName').value=g.name;document.getElementById('fPrice').value=g.price;
  document.getElementById('fDesc').value=g.descr||'';document.getElementById('fCat').value=g.cat;
  document.getElementById('fPv').innerHTML=thumb(g);
  refreshCatOptions();renderEmoji();
  document.getElementById('formMask').classList.add('show');
}
function refreshCatOptions(){document.getElementById('catOptions').innerHTML=categories.map(c=>`<option value="${c.name}">`).join('');}
function closeForm(){document.getElementById('formMask').classList.remove('show');}
function pickImg(){document.getElementById('fImgFile').click();}
function toggleEmoji(){const el=document.getElementById('emojiList');el.style.display=el.style.display==='none'?'flex':'none';}
function renderEmoji(){
  document.getElementById('emojiList').innerHTML=EMO.map(e=>`<div class="emoj ${e===chosenEmoji?'on':''}" onclick="setEmoji('${e}')">${e}</div>`).join('');
}
function setEmoji(e){ chosenEmoji=e;curImgInfo=null;document.getElementById('fPv').innerHTML=`<span style="font-size:34px">${e}</span>`; }
document.getElementById('fImgFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=640;let w=img.width,h=img.height;
      if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl=c.toDataURL('image/jpeg',0.7);
      curImgInfo={type:'img',data:dataUrl};
      document.getElementById('fPv').innerHTML=`<img src="${dataUrl}">`;
      document.getElementById('emojiList').style.display='none';
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
});
async function saveForm(){
  const name=document.getElementById('fName').value.trim();
  const price=parseFloat(document.getElementById('fPrice').value);
  const descr=document.getElementById('fDesc').value.trim();
  const cat=document.getElementById('fCat').value.trim();
  if(!name){toast('请填写菜名');return;}
  if(isNaN(price)||price<0){toast('请填写有效价格');return;}
  if(!cat){toast('请填写分类');return;}
  const data={name,price,cat,descr,emoji:chosenEmoji||'🍽️',color:'#ff8b4d',img:curImgInfo&&curImgInfo.type==='img'?curImgInfo.data:''};
  try{
    // 若输入的分类在分类表中不存在，自动新增该分类
    if(!categories.some(c=>c.name===cat)){
      const rc=await client.db.from('categories').insert().values({name:cat,sort:categories.length+1});
      if(rc&&rc.success) categories.push({id:rc.data,name:cat,sort:categories.length+1});
    }
    if(editingId==null){
      const res=await client.db.from('dishes').insert().values(data);
      if(res&&res.success){ data.id=res.data; items.push(data); toast('已新增菜品'); }
      else{ toast(res&&res.message||'新增失败'); return; }
    }else{
      const up=Object.assign({},data);if(!up.img)up.img=items.find(i=>i.id===editingId).img||'';
      const res=await client.db.from('dishes').update().set(up).eq('id',editingId);
      if(res&&res.success){ Object.assign(items.find(i=>i.id===editingId),up); toast('已保存修改'); }
      else{ toast(res&&res.message||'保存失败'); return; }
    }
  }catch(e){ toast('网络异常，保存失败'); console.error(e); return; }
  closeForm();
  const ci=categories.findIndex(c=>c.name===cat);if(ci>=0){curCat=ci;}
  render();updateBar();
}
async function delItem(id){
  if(!confirm('确定删除该菜品？'))return;
  try{
    const res=await client.db.from('dishes').delete().eq('id',id);
    if(res&&res.success){ items=items.filter(i=>i.id!==id);delete cart[id];render();updateBar();closeDetail();toast('已删除'); }
    else{ toast(res&&res.message||'删除失败'); }
  }catch(e){ toast('网络异常，删除失败'); console.error(e); }
}

/* ---------- 分类管理 ---------- */
function openCat(){
  renderCatsManager();
  document.getElementById('catMask').classList.add('show');
}
function closeCat(){document.getElementById('catMask').classList.remove('show');}
function renderCatsManager(){
  const box=document.getElementById('catList');
  if(!categories.length){box.innerHTML='<div class="empty">暂无分类</div>';return;}
  box.innerHTML=categories.map(c=>{const n=items.filter(i=>i.cat===c.name).length;return `
    <div class="cart-item">
      <div class="nm">${c.name}<br><span style="color:var(--sub);font-size:12px">${n} 道菜</span></div>
      <div class="stepper">
        <button class="st-btn" title="改名" onclick="renameCat(${c.id},'${c.name}')">✏️</button>
        <button class="st-btn" title="删除" onclick="delCat(${c.id},'${c.name}')">🗑️</button>
      </div>
    </div>`;}).join('');
}
async function addCat(){
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast('请输入分类名');return;}
  if(categories.some(c=>c.name===name)){toast('该分类已存在');return;}
  try{
    const res=await client.db.from('categories').insert().values({name,sort:categories.length+1});
    if(res&&res.success){categories.push({id:res.data,name,sort:categories.length+1});renderCatsManager();render();toast('已新增分类');}
    else toast(res&&res.message||'新增失败');
  }catch(e){toast('网络异常');}
  document.getElementById('newCatName').value='';
}
async function renameCat(id,oldName){
  const newName=prompt('输入新的分类名',oldName);
  if(!newName||newName===oldName)return;
  if(categories.some(c=>c.id!==id&&c.name===newName)){toast('该分类名已存在');return;}
  try{
    await client.db.from('categories').update().set({name:newName}).eq('id',id);
    const ds=items.filter(i=>i.cat===oldName);
    for(const d of ds){ await client.db.from('dishes').update().set({cat:newName}).eq('id',d.id); }
    const c=categories.find(x=>x.id===id);if(c)c.name=newName;
    items.forEach(i=>{if(i.cat===oldName)i.cat=newName;});
    render();renderCatsManager();toast('已重命名');
  }catch(e){toast('操作失败');console.error(e);}
}
async function delCat(id,name){
  const n=items.filter(i=>i.cat===name).length;
  const msg= n>0 ? `分类“${name}”下有 ${n} 道菜，删除分类会一并删除这些菜，确定删除？` : `确定删除分类“${name}”？`;
  if(!confirm(msg))return;
  try{
    if(n>0){
      const ds=items.filter(i=>i.cat===name);
      for(const d of ds){ await client.db.from('dishes').delete().eq('id',d.id); delete cart[d.id]; }
    }
    await client.db.from('categories').delete().eq('id',id);
    categories=categories.filter(x=>x.id!==id);
    items=items.filter(i=>i.cat!==name);
    if(curCat>=categories.length)curCat=0;
    render();renderCatsManager();updateBar();toast('已删除分类');
  }catch(e){toast('操作失败');console.error(e);}
}

let tT=null;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('show'),1600);}

loadData();
</script>
